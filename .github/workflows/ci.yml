name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    # A personal runner must never execute code from public pull requests.
    if: >-
      github.repository == 'dafepro/tcg-scan' &&
      github.actor == 'dafepro' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, macOS, ARM64, dcarrell-mac]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install chromium
        timeout-minutes: 5
      - run: npm run test:e2e
        env:
          RUN_LIVE_OCR: "1"
          RUN_LIVE_VISION: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
