name: Seal request credential for registered repositories
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seal:
    if: github.repository == 'dafepro/tcg-scan' && github.ref == 'refs/heads/main' && github.actor_id == '313492551'
    runs-on: ubuntu-24.04
    steps:
      - name: Install sealed-box implementation
        run: python3 -m pip install PyNaCl==1.6.0
      - name: Seal issue-only token with destination public keys
        env:
          REQUEST_TOKEN: ${{ secrets.DEPLOY_REQUEST_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,base64
          from pathlib import Path
          from nacl.public import PublicKey,SealedBox
          token=os.environ['REQUEST_TOKEN'].encode()
          if not token:raise SystemExit('Missing issue-only credential')
          keys={'quicktrack-home':'MINc+qnn4GRCNpMyyHRpn6SZIkPjbxiCTXgHMD/CnXQ=','deploy':'oCAPMM/AYzK7a0EoTIVBTf+ysHv/StcKPWOD4zsRImA='}
          root=Path(os.environ['RUNNER_TEMP'])/'sealed-request'
          root.mkdir(mode=0o700)
          for repo,key in keys.items():
              encrypted=base64.b64encode(SealedBox(PublicKey(base64.b64decode(key))).encrypt(token)).decode()
              (root/(repo+'.json')).write_text(json.dumps({'key_id':'3380204578043523366','encrypted_value':encrypted}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sealed-request-credential
          path: ${{ runner.temp }}/sealed-request/*.json
          retention-days: 1
          if-no-files-found: error
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/sealed-request"
