name: CI
# The owner can run trusted main on Mac (default) or explicitly select Ubuntu.
on:
  workflow_call:
    inputs:
      build_runner:
        type: string
        default: default
  workflow_dispatch:
    inputs:
      build_runner:
        description: Use the repository preference, Mac, or GitHub-hosted Ubuntu
        type: choice
        default: default
        options: [default, mac, github]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    # A personal runner must never execute code from public pull requests.
    if: >-
      github.repository == 'dafepro/tcg-scan' &&
      github.actor_id == '313492551' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ${{ (inputs.build_runner == 'mac' || (inputs.build_runner != 'github' && vars.BUILD_RUNNER != 'github')) && fromJSON('["self-hosted","macOS","ARM64","dcarrell-mac"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install chromium
        timeout-minutes: 5
      - run: npm run test:e2e
        env:
          RUN_LIVE_OCR: "1"
          RUN_LIVE_VISION: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
